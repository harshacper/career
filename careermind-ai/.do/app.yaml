name: careermind-ai
region: nyc
services:
  - name: backend-api
    github:
      repo: your-github-username/your-repo-name
      branch: main
      deploy_on_push: true
    source_dir: backend
    envs:
      - key: PORT
        value: "8080"
      - key: MONGO_URI
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
static_sites:
  - name: frontend-web
    github:
      repo: your-github-username/your-repo-name
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm run build
    output_dir: dist
    envs:
      - key: VITE_API_URL
        value: ${backend-api.PUBLIC_URL}/api
